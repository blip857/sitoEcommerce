backend:
  name: git-gateway
  branch: master 

media_folder: "public/assets"
public_folder: "/assets"

# Questa sezione mancava ed è obbligatoria
media_library:
  name: cloudinary # O 'upload' se vuoi salvare nel repo
  config:
    cloud_name: your_cloud_name
    api_key: your_api_key

collections:
  - name: "prodotti"
    label: "Prodotti"
    folder: "src/content/prodotti"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome", name: "nome", widget: "string" }
      - { label: "Prezzo", name: "prezzo", widget: "number" }
      - { label: "Immagine", name: "immagine", widget: "image" }