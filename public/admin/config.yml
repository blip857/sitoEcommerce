backend:
  name: github
  repo: blip857/sitoEcommerce # Sostituisci con il tuo username/nome-repo esatto
  branch: master # O main, a seconda del tuo branch
  base_url: https://sitoecommerce.pages.dev # L'URL del tuo sito su Cloudflare
  auth_endpoint: /api/auth # Questa sarà la "porta sicura" che creeremo tra poco

media_folder: "public/assets"
public_folder: "/assets"

# Questa sezione mancava ed è obbligatoria
media_library:
  name: cloudinary # O 'upload' se vuoi salvare nel repo
  config:
    cloud_name: your_cloud_name
    api_key: your_api_key

collections:
  - name: "prodotti"
    label: "Prodotti"
    folder: "src/content/prodotti"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome", name: "nome", widget: "string" }
      - { label: "Prezzo", name: "prezzo", widget: "number" }
      - { label: "Immagine", name: "immagine", widget: "image" }